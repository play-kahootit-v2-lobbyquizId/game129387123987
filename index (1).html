<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No confíes ciegamente en códigos QR</title>
<style>
  :root{
    --bg:#050505;
    --fg:#e8e6e2;
    --fg-dim:#8a8782;
    --line:#232323;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--fg);
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:8vh 6vw;
    font-family:'Courier New', 'JetBrains Mono', monospace;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .skull{
    width:min(34vw,240px);
    opacity:0.88;
    margin-bottom:3.5rem;
    filter:drop-shadow(0 0 30px rgba(0,0,0,0.7));
    -webkit-mask-image:radial-gradient(circle,#000 60%,transparent 100%);
    mask-image:radial-gradient(circle,#000 60%,transparent 100%);
  }
  h1{
    font-weight:400;
    font-size:clamp(1.6rem,4.2vw,3rem);
    line-height:1.35;
    letter-spacing:0.01em;
    max-width:18ch;
    margin:0 0 2.2rem 0;
  }
  .rule{
    width:60px;
    height:1px;
    background:var(--line);
    margin-bottom:2.2rem;
  }
  p.sub{
    color:var(--fg-dim);
    font-size:clamp(0.85rem,1.4vw,1rem);
    max-width:38ch;
    line-height:1.6;
    margin:0;
  }
  @media (prefers-reduced-motion: no-preference){
    h1{animation:fade 1.1s ease-out both;}
    .skull{animation:fade 1.4s ease-out both;}
  }
  @keyframes fade{
    from{opacity:0;transform:translateY(6px);}
  }
</style>
</head>
